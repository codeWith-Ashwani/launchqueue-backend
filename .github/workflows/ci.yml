name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install pinned k6 with checksum verification
        run: |
          curl --fail --location --silent --show-error -O https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          curl --fail --location --silent --show-error -O https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-checksums.txt
          grep ' k6-v2.3.0-linux-amd64.tar.gz$' k6-v2.3.0-checksums.txt | sha256sum --check --strict
          tar -xzf k6-v2.3.0-linux-amd64.tar.gz
          echo "${GITHUB_WORKSPACE}/server/k6-v2.3.0-linux-amd64" >> "$GITHUB_PATH"

      - name: Gate concurrent analytics performance on isolated data
        run: npm run performance:smoke
        env:
          PERFORMANCE_P95_MS: 2000

      - name: Save isolated performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-performance
          path: docs/performance/*.json
          if-no-files-found: ignore
