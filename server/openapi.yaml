        plan:
          type: string
          enum:
            - free
            - starter
            - pro
            - agency
        customerPortalUrl:
          anyOf:
            -
              type: string
            -
              type: 'null'
        authProvider:
          type: string
          enum:
            - local
            - google
        createdAt:
          type: string
          format: date-time
        subscriptionStatus:
          type: string
        subscriptionEndsAt:
          anyOf:
            -
              type: string
              format: date-time
            -
              type: 'null'
        isAdmin:
          type: boolean
      required:
        - id
        - name
        - email
        - plan
        - customerPortalUrl
        - authProvider
        - createdAt
        - subscriptionStatus
        - subscriptionEndsAt
        - isAdmin
      additionalProperties: false
